# Configuracion base Quarkus
quarkus.http.port=${HTTP_PORT:8081}
quarkus.http.host=0.0.0.0

# MySQL local (iniciar con docker compose up -d mysql)
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=${DB_USERNAME:argus}
quarkus.datasource.password=${DB_PASSWORD:argus_local}
quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:mysql://localhost:3306/argus_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
quarkus.hibernate-orm.schema-management.strategy=${DB_SCHEMA_STRATEGY:update}
# Columnas JSON (vulnerabilities.stix_payload) usan el formato propio de Hibernate, no el ObjectMapper de REST.
quarkus.hibernate-orm.mapping.format.global=ignore

# REST, JSON y documentacion
quarkus.jackson.write-dates-as-timestamps=false
quarkus.smallrye-openapi.info-title=Argus API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.swagger-ui.always-include=true

# Firebase Admin: configurar ruta a credenciales fuera del repositorio al usar Firebase
firebase.credentials.path=${FIREBASE_SERVICE_ACCOUNT_LOCATION:}
firebase.web-api-key=${FIREBASE_WEB_API_KEY:}

# Kafka local
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
quarkus.kafka.devservices.enabled=false

# RabbitMQ local
rabbitmq-host=${RABBITMQ_HOST:localhost}
rabbitmq-port=${RABBITMQ_PORT:5672}
rabbitmq-username=${RABBITMQ_USERNAME:guest}
rabbitmq-password=${RABBITMQ_PASSWORD:guest}
quarkus.rabbitmq.devservices.enabled=false

# ---------------------------------------------------------------------------
# Kafka: productor de eventos STIX 2.1 del parser Nessus -> Agente de IA
# Contrato del mensaje: docs/kafka-stix-contract.md
# ---------------------------------------------------------------------------
mp.messaging.outgoing.vulnerability-ingest.connector=smallrye-kafka
mp.messaging.outgoing.vulnerability-ingest.topic=${KAFKA_VULNERABILITY_TOPIC:vulnerabilities-ingest}
mp.messaging.outgoing.vulnerability-ingest.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.vulnerability-ingest.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
# Durabilidad: el broker confirma solo cuando todas las réplicas en ISR tienen el registro; sin duplicados por reintento.
mp.messaging.outgoing.vulnerability-ingest.acks=all
mp.messaging.outgoing.vulnerability-ingest.enable.idempotence=true
mp.messaging.outgoing.vulnerability-ingest.compression.type=lz4
mp.messaging.outgoing.vulnerability-ingest.linger.ms=5
mp.messaging.outgoing.vulnerability-ingest.batch.size=65536
mp.messaging.outgoing.vulnerability-ingest.delivery.timeout.ms=45000
mp.messaging.outgoing.vulnerability-ingest.request.timeout.ms=20000
# Alineado con max.message.bytes del tópico (5 MiB, ver docker-compose.messaging.yml).
mp.messaging.outgoing.vulnerability-ingest.max.request.size=5242880

# Enriquecer cada evento con el activo dueño de la IP (tabla asset_ips). Si la BD falla se publica igual.
argus.ingest.resolve-assets=${ARGUS_INGEST_RESOLVE_ASSETS:true}
# Exportaciones Nessus pueden ser grandes.
quarkus.http.limits.max-body-size=50M
# Riesgo mínimo de Nessus que se publica (NONE, LOW, MEDIUM, HIGH, CRITICAL).
argus.nessus.min-risk=${ARGUS_NESSUS_MIN_RISK:MEDIUM}
