services:
  mysql:
    image: mysql:8.4
    container_name: argus-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-argus_db}
      MYSQL_USER: ${MYSQL_USER:-argus}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-argus_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local}
    ports:
      # Usa MYSQL_HOST_PORT=3307 si ya tienes otro MySQL local en 3306 (y ajusta DB_JDBC_URL).
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u$${MYSQL_USER}", "-p$${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Apache Kafka en modo KRaft (broker + controller en un solo nodo, sin ZooKeeper).
  # - Desde el host (Quarkus en dev mode):      localhost:9092
  # - Desde otros contenedores (Agente de IA):  kafka:29092
  kafka:
    image: apache/kafka:3.9.0
    container_name: argus-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      # ID de clúster KRaft (UUID de 16 bytes en base64url, 22 caracteres).
      CLUSTER_ID: QXJndXNLcmFmdExvY2FsMQ
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Los tópicos se crean explícitamente en kafka-init (contrato fijo de particiones/retención).
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  # Job de una sola ejecución: crea los tópicos del pipeline de vulnerabilidades.
  kafka-init:
    image: apache/kafka:3.9.0
    container_name: argus-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        T=/opt/kafka/bin/kafka-topics.sh
        B=kafka:29092
        # Eventos STIX 2.1 producidos por el parser Nessus (retención 7 días).
        $$T --bootstrap-server $$B --create --if-not-exists --topic vulnerabilities-ingest \
          --partitions 3 --replication-factor 1 \
          --config retention.ms=604800000 --config max.message.bytes=5242880
        # Dead-letter queue para mensajes que el Agente de IA no pueda procesar (retención 30 días).
        $$T --bootstrap-server $$B --create --if-not-exists --topic vulnerabilities-ingest-dlq \
          --partitions 1 --replication-factor 1 \
          --config retention.ms=2592000000
        $$T --bootstrap-server $$B --list

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: argus-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: argus-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: argus-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  mysql_data:
  rabbitmq_data:
